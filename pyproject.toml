[project]
name = "campaign-doctor"
version = "0.1.0"
description = "Synthetic campaign replay engine and local read-only API."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
campaign-doctor = "campaign_doctor.cli:console_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "cardinal_review_tests.py", "cardinal_m2_review_tests.py"]
